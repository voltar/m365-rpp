<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https://graph.microsoft.com https://*.sharepoint.com https://res.cdn.office.net;
               connect-src 'self'
                         https://login.microsoftonline.com https://*.microsoftonline.com
                         https://graph.microsoft.com https://*.sharepoint.com https://res.cdn.office.net
                         https://*.office.com https://*.microsoft.com
                         https://openholidaysapi.org
                         https://daten.stadt.sg.ch https://data.stadt-zuerich.ch
                         http://localhost:5004 http://127.0.0.1:5004
                         https://localhost:5005 https://127.0.0.1:5005;
               font-src 'self' data:;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>M365 Ressourcen &amp; Präsenzplanung</title>
    <meta
      name="description"
      content="Sehen, wer wann verfügbar ist — direkt in Microsoft Teams."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      EO-429: link previews for the public demo. These tags are static on purpose - link
      crawlers (WhatsApp, iMessage, Slack) execute no JavaScript, so they can be neither
      rendered by React nor read from /config/runtime-config.js, and og:image must be an
      absolute URL.

      The canonical origin below is therefore hardcoded, a documented exception to ADR-003's
      one-artefact rule: rpp.example.com is the only deployment ever shared as a link. The
      Teams-hosted installations sit behind authentication and are opened through Teams, so a
      preview for them would never be rendered by anyone. Nothing at runtime depends on this.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RPP" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:url" content="https://rpp.example.com/" />
    <meta property="og:title" content="RPP – Ressourcen &amp; Präsenzplanung" />
    <meta
      property="og:description"
      content="Sehen, wer wann verfügbar ist — direkt in Microsoft Teams."
    />
    <meta property="og:image" content="https://rpp.example.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RPP – Ressourcen &amp; Präsenzplanung, eine Microsoft-Teams-App von Voltar"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RPP – Ressourcen &amp; Präsenzplanung" />
    <meta
      name="twitter:description"
      content="Sehen, wer wann verfügbar ist — direkt in Microsoft Teams."
    />
    <meta name="twitter:image" content="https://rpp.example.com/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
